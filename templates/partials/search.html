<header class="top-bar">
    <a id="header" class="brand-mark" href="{% url 'home' %}" aria-label="VaseCrib home">
        <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M4 15.2 16 5l12 10.2v11.3a1.5 1.5 0 0 1-1.5 1.5h-21A1.5 1.5 0 0 1 4 26.5V15.2Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M12 28V18h8v10M9 14.5h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>VaseCrib</h1>
    </a>
    <form class="search-box" method="get" action="{% url 'listings' %}">
        <input
            type="text"
            name="q"
            value="{{ query|default:'' }}"
            placeholder="e.g. 3 Bedroom, Self-Contain"
        >
        <button type="submit" aria-label="Search"><i class="fas fa-search"></i></button>
    </form>
</header>

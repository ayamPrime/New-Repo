{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <title>EL-VANTA | Create an Account</title>
</head>
<body>
    <div class="form-space">
        <div class="formgroup">
            <header id="heading">
                <h1>ACCOMMODATIONS HUB</h1>
            </header>
            <form action="" class="form">
                <div class="formelements">
                    <label for="firstname">First Name</label>
                    <input type="text" id="firstname" placeholder="Enter First Name" required>
                </div>
                <div class="formelements">
                    <label for="surname">Surname</label>
                    <input type="text" id="surname" placeholder="Enter Surname" required>
                </div>
                <div class="formelements">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter valid email" required>
                </div>
                <div class="formelements">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>
                <div class="formelements">
                    <label for="gender">Gender</label>
                    <select name="gender" id="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="formelements">
                    <label for="password">Create Password</label>
                    <input type="password" id="password" placeholder="Enter Password" required>
                </div>
                <!-- <div class="formelements"></div> -->
                <!-- <div class="buttons">
                    <button type="submit">
                        Submit
                    </button>
                </div> -->
            </form>
            <div class="buttons">
                <button type="submit">
                    Submit
                </button>
            </div>
        </div>
    </div>
</body>
</html>

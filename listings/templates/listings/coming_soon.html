{% extends 'base.html' %}
{% load static %}

{% block title %}{{ feature }} — Coming Soon{% endblock %}

{% block content %}
<div style="
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    font-family: 'Work Sans', sans-serif;
    text-align: center;
">
    <h1 style="
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: 2rem;
        margin: 0 0 12px;
        color: #1C1F1D;
    ">{{ feature }}</h1>
    <p style="color: #5C6360; margin: 0 0 32px;">
        This feature is coming soon. We're working on it.
    </p>
    <a href="{% url 'listing_detail' listing.pk %}" style="
        display: inline-block;
        padding: 12px 28px;
        background: #1E3A5F;
        color: #FFFFFF;
        text-decoration: none;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.9rem;
    ">← Back to Listing</a>
</div>
{% endblock %}
